openapi: 3.0.3
info:
  title: Project Activity API
  version: 1.0.0
  description: |-
    API проектной деятельности студентов.

    ## Авторизация
    JWT Bearer: получите `access` через `POST /api/accounts/login/`, затем Authorize → `Bearer <access>`.

    ## Postman
    Импортируйте схему: Import → Link → `http://localhost:8000/api/schema/` (local) или `https://pd.emiit.ru/api/schema/` (prod). Включите синхронизацию с источником (Keep in sync / Update from definition).
paths:
  /api/accounts/departments/:
    get:
      operationId: accounts_departments_list
      description: |-
        ViewSet только для чтения подразделений/кафедр.

        Список подразделений должен быть доступен всем пользователям (AllowAny),
        чтобы пользователь мог выбрать своё подразделение ещё до авторизации.
        Другие действия (detail) по умолчанию требуют авторизации.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
          description: ''
  /api/accounts/departments/{id}/:
    get:
      operationId: accounts_departments_retrieve
      description: |-
        ViewSet только для чтения подразделений/кафедр.

        Список подразделений должен быть доступен всем пользователям (AllowAny),
        чтобы пользователь мог выбрать своё подразделение ещё до авторизации.
        Другие действия (detail) по умолчанию требуют авторизации.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Подразделение.
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
  /api/accounts/login/:
    post:
      operationId: accounts_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/password/change/:
    post:
      operationId: accounts_password_change_create
      description: Сменяет пароль текущего пользователя после проверки текущего пароля.
      summary: Смена пароля
      tags:
