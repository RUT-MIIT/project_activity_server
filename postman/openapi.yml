      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRegistrationRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRegistrationRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRegistrationRequestRequest'
      security:
      - jwtAuth: []
      - bearerAuth: []
