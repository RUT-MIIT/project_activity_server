components:
  schemas:
    AcademicYear:
      type: object
      description: Сериализатор учебного года (краткий).
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          title: Код
          maxLength: 64
        name:
          type: string
          title: Название
          maxLength: 255
      required:
      - code
      - id
      - name
    AcademicYearRequest:
      type: object
      description: Сериализатор учебного года (краткий).
      properties:
        code:
          type: string
          minLength: 1
          title: Код
          maxLength: 64
        name:
          type: string
          minLength: 1
          title: Название
          maxLength: 255
      required:
      - code
      - name
    ApplicationStatusRead:
      type: object
      description: |-
        Сериализатор для отображения (чтения) статусов заявок на проекты.
        Используется для GET-запросов.
      properties:
        code:
          type: string
          title: Код статуса
          maxLength: 50
        name:
          type: string
          title: Название статуса
          maxLength: 100
      required:
      - code
      - name
    CustomTokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    Department:
      type: object
      description: Сериализатор для подразделений/кафедр.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название подразделения
          maxLength: 255
        short_name:
          type: string
          title: Краткое название
          maxLength: 64
      required:
      - id
      - name
      - short_name
    DepartmentPlan:
      type: object
      description: Сериализатор для создания/обновления плана подразделения.
      properties:
        department_id:
          type: integer
        semester_id:
          type: integer
        plan:
          type: integer
          minimum: 0
      required:
      - department_id
      - plan
      - semester_id
    DepartmentPlanRequest:
      type: object
      description: Сериализатор для создания/обновления плана подразделения.
      properties:
        department_id:
          type: integer
        semester_id:
          type: integer
        plan:
          type: integer
          minimum: 0
      required:
      - department_id
      - plan
      - semester_id
    DepartmentRequest:
      type: object
      description: Сериализатор для подразделений/кафедр.
      properties:
        name:
          type: string
          minLength: 1
          title: Название подразделения
          maxLength: 255
        short_name:
          type: string
          minLength: 1
          title: Краткое название
          maxLength: 64
      required:
      - name
      - short_name
    Direction:
      type: object
      description: Сериализатор направления подготовки.
      properties:
        code:
          type: string
          title: Код направления
          maxLength: 9
        level:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          title: Уровень подготовки
        name:
          type: string
          title: Название
          maxLength: 512
      required:
      - code
      - level
      - name
    DirectionNested:
      type: object
      properties:
        code:
          type: string
          title: Код направления
          maxLength: 9
        level:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          title: Уровень подготовки
        name:
          type: string
          title: Название
          maxLength: 512
      required:
      - code
      - level
      - name
    Institute:
      type: object
      description: Сериализатор для институтов/академий.
      properties:
        code:
          type: string
          title: Код института
          maxLength: 50
        name:
          type: string
          title: Название института
          maxLength: 100
        department_id:
          type: integer
          readOnly: true
      required:
      - code
      - department_id
      - name
    InstituteNested:
      type: object
      properties:
        code:
          type: string
          title: Код института
          maxLength: 50
        name:
          type: string
          title: Название института
          maxLength: 100
      required:
      - code
      - name
    LevelEnum:
      enum:
      - бакалавриат
      - специалитет
      type: string
      description: |-
        * `бакалавриат` - Бакалавриат
        * `специалитет` - Специалитет
    PaginatedApplicationStatusReadList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationStatusRead'
    PaginatedProjectApplicationCreateList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectApplicationCreate'
    PaginatedTeamList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Team'
    PasswordChangeRequest:
      type: object
      description: Сериализатор для смены пароля аутентифицированного пользователя.
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - current_password
      - new_password
    PasswordReset:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PasswordResetConfirm:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
