      - in: query
        name: status
        schema:
          type: string
          title: Статус
          enum:
          - approved
          - rejected
          - submitted
        description: |-
          * `submitted` - Подана
          * `approved` - Одобрена
          * `rejected` - Отклонена
      tags:
      - accounts
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
